<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbf8ff" />
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#151219" />
<title>Debian NAS · 登录</title>
<link rel="stylesheet" href="./fonts.css" />
<style>
  :root {
    --p: #6252a1; --on-p: #fff; --surface: #fbf8ff; --card: #fff;
    --on-surface: #1d1a22; --on-surface-variant: #494551; --outline: #7a7581;
    --error: #b3261e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font-family: "Inter", "Debnas Sans SC", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    color: var(--on-surface);
    background:
      radial-gradient(55% 60% at 8% -10%, color-mix(in srgb, var(--p) 16%, transparent), transparent 70%),
      radial-gradient(45% 55% at 92% -12%, rgba(0,105,109,.10), transparent 70%),
      var(--surface);
  }
  .card {
    width: min(92vw, 380px); padding: 34px 30px 28px;
    border-radius: 28px; background: var(--card);
    box-shadow: 0 18px 50px rgba(28,27,32,.12), 0 2px 8px rgba(28,27,32,.06);
  }
  h1 { margin: 0 0 4px; font-size: 22px; font-weight: 650; letter-spacing: -.01em; }
  p.sub { margin: 0 0 24px; font-size: 12.5px; color: var(--on-surface-variant); }
  label { display: block; font-size: 11.5px; color: var(--on-surface-variant); margin: 14px 0 6px; }
  input {
    width: 100%; padding: 12px 14px; font: inherit; font-size: 13.5px;
    border-radius: 14px; border: 1px solid #d9d3e0; background: #fff; color: inherit;
  }
  input:focus { outline: none; border-color: var(--p); box-shadow: 0 0 0 3px color-mix(in srgb, var(--p) 18%, transparent); }
  button {
    width: 100%; margin-top: 22px; padding: 12px; border: 0; cursor: pointer;
    border-radius: 999px; background: var(--p); color: var(--on-p);
    font: inherit; font-size: 13.5px; font-weight: 600;
    transition: filter .18s, transform .18s;
  }
  button:hover { filter: brightness(1.06); }
  button:active { transform: scale(.99); }
  button[disabled] { opacity: .6; cursor: default; }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --p: rgb(207 189 255);
      --on-p: rgb(51 44 72);
      --surface: rgb(21 18 25);
      --card: rgb(28 27 33);
      --on-surface: rgb(228 225 234);
      --on-surface-variant: rgb(200 197 206);
      --outline: rgb(146 143 152);
      --error: #ffb4ab;
    }
    body {
      background:
        radial-gradient(55% 60% at 8% -10%, color-mix(in srgb, var(--p) 18%, transparent), transparent 70%),
        radial-gradient(45% 55% at 92% -12%, rgba(0,105,109,.16), transparent 70%),
        var(--surface);
    }
    .card {
      box-shadow: 0 18px 50px rgba(0,0,0,.45), 0 2px 8px rgba(0,0,0,.35);
    }
    input {
      background: rgb(43 41 48);
      border-color: rgb(72 70 77);
      color: var(--on-surface);
    }
    input::placeholder { color: var(--outline); }
    input:-webkit-autofill {
      -webkit-text-fill-color: var(--on-surface);
      -webkit-box-shadow: 0 0 0 1000px rgb(43 41 48) inset;
    }
    .insecure {
      background: #3a2c10;
      color: #ffdf9e;
      border-color: #6b511f;
    }
  }
  .err { margin-top: 14px; min-height: 18px; font-size: 12.5px; color: var(--error); }
  .insecure {
    margin: 0 0 14px; padding: 9px 11px; border-radius: 12px;
    background: #fff4d6; color: #6d4b00; border: 1px solid #f0d38a;
    font-size: 11.5px; line-height: 1.55;
  }
</style>
</head>
<body>
  <form class="card" id="form">
    <h1>Debian NAS</h1>
    <p class="sub">使用系统账号登录</p>
    <div class="insecure" id="insecure" hidden>当前是 HTTP 连接，密码会明文经过局域网；只建议在可信 Wi-Fi 下使用。</div>
    <label for="user">用户名</label>
    <input id="user" name="user" autocomplete="username" autofocus />
    <label for="pass">密码</label>
    <input id="pass" name="password" type="password" autocomplete="current-password" />
    <button id="go" type="submit">登录</button>
    <div class="err" id="err"></div>
  </form>
<script>
  if (location.protocol === "http:") document.getElementById("insecure").hidden = false;
  document.getElementById("form").addEventListener("submit", async function (e) {
    e.preventDefault();
    var btn = document.getElementById("go");
    var err = document.getElementById("err");
    err.textContent = "";
    btn.disabled = true;
    try {
      var r = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          user: document.getElementById("user").value.trim(),
          password: document.getElementById("pass").value
        })
      });
      var d = await r.json();
      if (!r.ok) throw new Error(d.error || "登录失败");
      try { sessionStorage.setItem("debnas-csrf", d.csrf); } catch (x) {}
      location.href = "/";
    } catch (x) {
      err.textContent = x.message;
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
